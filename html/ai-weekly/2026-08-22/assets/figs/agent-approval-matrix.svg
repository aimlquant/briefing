<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터형 에이전트의 승인 매트릭스</title><desc id="desc">행동의 가역성과 외부 영향에 따라 자동 실행, 사후 알림, 사전 승인, 금지로 나누는 사분면</desc>
  <style>.bg{fill:#f7f8fb}.cell{stroke:#fff;stroke-width:8}.auto{fill:#dcefe7}.notify{fill:#dce9ff}.approve{fill:#fff0cf}.deny{fill:#f7dce2}.axis{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.h{font:900 26px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.tag{font:950 17px Inter,'Noto Sans KR',sans-serif}.g{fill:#18714d}.b{fill:#2563eb}.o{fill:#906200}.r{fill:#a93650}</style>
  <rect class="bg" width="1200" height="630" rx="24"/><text class="h" x="600" y="62" text-anchor="middle">외부 영향 × 되돌릴 수 있는가</text>
  <text class="axis" x="88" y="332" transform="rotate(-90 88 332)" text-anchor="middle">외부 영향 · 낮음 → 높음</text><text class="axis" x="650" y="590" text-anchor="middle">가역성 · 높음 → 낮음</text>
  <g transform="translate(150 96)"><g><rect class="cell auto" width="440" height="210" rx="18"/><text class="tag g" x="28" y="42">AUTO</text><text class="h" x="28" y="84">자동 실행</text><text class="s" x="28" y="122">읽기 · 초안 · 샌드박스 테스트</text><text class="s" x="28" y="154">비밀 없음 · 로컬 롤백 가능</text><text class="s" x="28" y="186">비용·시간 상한 필수</text></g><g transform="translate(460)"><rect class="cell notify" width="440" height="210" rx="18"/><text class="tag b" x="28" y="42">RUN + NOTIFY</text><text class="h" x="28" y="84">실행 뒤 알림</text><text class="s" x="28" y="122">내부 문서 정리 · 임시 브랜치</text><text class="s" x="28" y="154">영향 범위 제한 · 복구 지점 존재</text><text class="s" x="28" y="186">결과와 diff를 사람에게 전송</text></g><g transform="translate(0 230)"><rect class="cell approve" width="440" height="210" rx="18"/><text class="tag o" x="28" y="42">ASK FIRST</text><text class="h" x="28" y="84">사전 승인</text><text class="s" x="28" y="122">구매 · 메일 전송 · 계정 변경</text><text class="s" x="28" y="154">외부 이해관계자·금전 영향</text><text class="s" x="28" y="186">대상·금액·최종 문구를 고정</text></g><g transform="translate(460 230)"><rect class="cell deny" width="440" height="210" rx="18"/><text class="tag r" x="28" y="42">DENY</text><text class="h" x="28" y="84">자동화 금지</text><text class="s" x="28" y="122">대량 삭제 · 송금 · 권한 승격</text><text class="s" x="28" y="154">복구 불가 · 법적/신체적 영향</text><text class="s" x="28" y="186">별도 시스템과 이중 승인</text></g></g>
</svg>
