<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>키 기반 텍스트 워터마크의 통계 흐름</title>
  <desc>문맥과 비밀 키가 저위험 단어 선택에 패턴을 남기고 긴 텍스트의 통계 점수로 누적되는 과정</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#1f5ea8;stroke-width:2}.key{fill:#f1edfb;stroke:#6d53a8;stroke-width:2}.score{fill:#e9f8f4;stroke:#1c8c72;stroke-width:2}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:19px;font-weight:850;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.line{stroke:#1f5ea8;stroke-width:4;fill:none}.weak{fill:#fff0ea;stroke:#e4562a;stroke-width:2}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <rect class="node" x="30" y="205" width="210" height="170" rx="20"/><rect class="key" x="310" y="205" width="210" height="170" rx="20"/><rect class="node" x="590" y="205" width="210" height="170" rx="20"/><rect class="score" x="870" y="205" width="300" height="170" rx="20"/>
  <g class="t" text-anchor="middle"><text x="135" y="255"><tspan x="135">다음 단어 후보</tspan><tspan class="s" x="135" dy="30">흐리다 · 잿빛이다</tspan><tspan class="s" x="135" dy="22">뜻이 비슷한 선택지</tspan></text><text x="415" y="245"><tspan x="415">문맥 + 비밀 키</tspan><tspan class="s" x="415" dy="30">무작위 선택을</tspan><tspan class="s" x="415" dy="22">재현 가능한 규칙으로</tspan></text><text x="695" y="255"><tspan x="695">일반 텍스트</tspan><tspan class="s" x="695" dy="30">숨은 문자 없음</tspan><tspan class="s" x="695" dy="22">추가 토큰 없음</tspan></text><text x="1020" y="245"><tspan x="1020">통계 일치 점수</tspan><tspan class="s" x="1020" dy="30">Claude 관여 가능성</tspan><tspan class="s" x="1020" dy="22">글이 길수록 더 정확</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="240" y1="290" x2="310" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="520" y1="290" x2="590" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="800" y1="290" x2="870" y2="290"/></g>
  <rect class="weak" x="155" y="455" width="890" height="92" rx="20"/><text class="t" x="600" y="493" text-anchor="middle">약한 구간: 짧은 글 · 사실 문장 · 교정 · 코드 · 대폭 재작성</text><text class="s" x="600" y="523" text-anchor="middle">검출돼도 저자·부정행위·진실을 증명하지 않고, 검출되지 않아도 AI 미사용을 확정하지 않는다</text>
</svg>
