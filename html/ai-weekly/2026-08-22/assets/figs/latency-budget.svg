<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>에이전트 작업 완료시간의 여섯 구간</title>
  <desc>요청 준비부터 첫 토큰, 생성, 도구 호출, 승인, 검증까지의 지연과 재시도 루프를 보여준다</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#1f5ea8;stroke-width:2}.node2{fill:#fff0ea;stroke:#e4562a;stroke-width:2}.num{font-family:Arial,sans-serif;font-size:18px;font-weight:900;fill:#1f5ea8}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px;font-weight:800;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.band{fill:#e9f2ff;stroke:#aac7eb;stroke-width:2}.line{stroke:#1f5ea8;stroke-width:4;fill:none}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <g><rect class="node" x="15" y="145" width="145" height="185" rx="18"/><rect class="node" x="220" y="145" width="145" height="185" rx="18"/><rect class="node" x="425" y="145" width="145" height="185" rx="18"/><rect class="node" x="630" y="145" width="145" height="185" rx="18"/><rect class="node2" x="835" y="145" width="145" height="185" rx="18"/><rect class="node" x="1040" y="145" width="145" height="185" rx="18"/></g>
  <g class="num"><text x="35" y="178">01</text><text x="240" y="178">02</text><text x="445" y="178">03</text><text x="650" y="178">04</text><text x="855" y="178">05</text><text x="1060" y="178">06</text></g>
  <g class="t" text-anchor="middle"><text x="87" y="228">요청 준비</text><text x="292" y="218"><tspan x="292">첫 토큰</tspan><tspan x="292" dy="26">TTFT</tspan></text><text x="497" y="218"><tspan x="497">토큰 생성</tspan><tspan x="497" dy="26">tok/s</tspan></text><text x="702" y="218"><tspan x="702">도구 호출</tspan><tspan x="702" dy="26">API · UI</tspan></text><text x="907" y="218"><tspan x="907">사람 승인</tspan><tspan x="907" dy="26">대기시간</tspan></text><text x="1112" y="218"><tspan x="1112">검증</tspan><tspan x="1112" dy="26">완료 판정</tspan></text></g>
  <g class="s" text-anchor="middle"><text x="87" y="294">업무 문맥</text><text x="292" y="294">대기열</text><text x="497" y="294">답변 생성</text><text x="702" y="294">네트워크</text><text x="907" y="294">담당자</text><text x="1112" y="294">테스트</text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="160" y1="237" x2="220" y2="237"/><line data-connector="true" marker-end="url(#arrow)" x1="365" y1="237" x2="425" y2="237"/><line data-connector="true" marker-end="url(#arrow)" x1="570" y1="237" x2="630" y2="237"/><line data-connector="true" marker-end="url(#arrow)" x1="775" y1="237" x2="835" y2="237"/><line data-connector="true" marker-end="url(#arrow)" x1="980" y1="237" x2="1040" y2="237"/><polyline data-connector="true" marker-end="url(#arrow)" points="1112,330 1112,485 87,485 87,330"/></g>
  <rect class="band" x="335" y="450" width="530" height="72" rx="18"/><text class="t" x="600" y="493" text-anchor="middle">실패하면 전체 루프가 다시 돈다</text>
</svg>
