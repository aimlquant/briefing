<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>AI 인프라 금융 플랫폼의 현금흐름 구조</title>
  <desc>기관 자본이 독립 금융 플랫폼과 데이터센터를 거쳐 컴퓨팅 사용 계약의 현금흐름으로 돌아오는 구조</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#1f5ea8;stroke-width:2}.asset{fill:#e9f2ff;stroke:#1f5ea8;stroke-width:2}.cash{fill:#e9f8f4;stroke:#1c8c72;stroke-width:2}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:19px;font-weight:850;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.line{stroke:#1f5ea8;stroke-width:4;fill:none}.return{stroke:#1c8c72;stroke-width:4;fill:none}.warn{fill:#fff0ea;stroke:#e4562a;stroke-width:2}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <rect class="node" x="30" y="180" width="190" height="175" rx="20"/><rect class="node" x="290" y="180" width="210" height="175" rx="20"/><rect class="asset" x="570" y="180" width="210" height="175" rx="20"/><rect class="node" x="850" y="180" width="150" height="175" rx="20"/><rect class="cash" x="1070" y="180" width="100" height="175" rx="20"/>
  <g class="t" text-anchor="middle"><text x="125" y="240"><tspan x="125">기관 자본</tspan><tspan class="s" x="125" dy="30">보험 · 연기금</tspan><tspan class="s" x="125" dy="22">사모대출</tspan></text><text x="395" y="230"><tspan x="395">독립 금융 플랫폼</tspan><tspan class="s" x="395" dy="30">Apollo · BlackRock</tspan><tspan class="s" x="395" dy="22">외 4개 파트너</tspan></text><text x="675" y="230"><tspan x="675">AI 데이터센터</tspan><tspan class="s" x="675" dy="30">GPU · 전력 · 냉각</tspan><tspan class="s" x="675" dy="22">토지 · 네트워크</tspan></text><text x="925" y="230"><tspan x="925">고객 계약</tspan><tspan class="s" x="925" dy="30">용량·기간</tspan><tspan class="s" x="925" dy="22">가동률</tspan></text><text x="1120" y="230"><tspan x="1120">현금</tspan><tspan class="s" x="1120" dy="30">사용료</tspan><tspan class="s" x="1120" dy="22">상환</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="220" y1="267" x2="290" y2="267"/><line data-connector="true" marker-end="url(#arrow)" x1="500" y1="267" x2="570" y2="267"/><line data-connector="true" marker-end="url(#arrow)" x1="780" y1="267" x2="850" y2="267"/><line data-connector="true" marker-end="url(#arrow)" x1="1000" y1="267" x2="1070" y2="267"/></g>
  <polyline class="return" data-connector="true" marker-end="url(#arrow)" points="1120,355 1120,455 125,455 125,355"/>
  <rect class="warn" x="225" y="500" width="750" height="82" rx="20"/><text class="t" x="600" y="535" text-anchor="middle">$500B+는 장기간 동원 목표</text><text class="s" x="600" y="565" text-anchor="middle">확정 투자액 · 즉시 집행액 · NVIDIA 매출과 같지 않다</text>
</svg>
