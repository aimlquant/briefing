<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 팩토리 금융 플랫폼의 자금 흐름</title><desc id="desc">장기 기관 자본, 독립 금융 플랫폼, GPU와 데이터센터, 토큰 매출로 이어지는 흐름과 위험 귀속을 보여주는 그림</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.hot{fill:#e8eef8;stroke:#2563eb;stroke-width:4}.h{font:900 22px Inter,'Noto Sans KR',sans-serif;fill:#101114}.big{font:950 46px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.risk{fill:#fff4dc;stroke:#e2a834;stroke-width:2}.tag{font:850 14px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}</style>
  <rect class="bg" width="1200" height="630" rx="24"/><text class="big" x="600" y="72" text-anchor="middle">$500B+</text><text class="s" x="600" y="102" text-anchor="middle">장기간 동원 목표 · 즉시 집행액/확정 매출 아님</text>
  <g transform="translate(38 162)"><g><rect class="box" width="220" height="180" rx="18"/><text class="tag" x="22" y="38">CAPITAL</text><text class="h" x="22" y="82">6개 금융사</text><text class="s" x="22" y="118">Apollo · BlackRock</text><text class="s" x="22" y="146">Blackstone · Brookfield</text></g><path class="line" d="M220 90 L264 90"/><g transform="translate(264)"><rect class="hot" width="260" height="180" rx="18"/><text class="tag" x="22" y="38">PLATFORM</text><text class="h" x="22" y="82">독립 금융 구조</text><text class="s" x="22" y="118">대출 · 자산 담보</text><text class="s" x="22" y="146">사용량 연계 수익</text></g><path class="line" d="M524 90 L568 90"/><g transform="translate(568)"><rect class="box" width="260" height="180" rx="18"/><text class="tag" x="22" y="38">AI FACTORY</text><text class="h" x="22" y="82">GPU · 전력 · DC</text><text class="s" x="22" y="118">장기 가동률</text><text class="s" x="22" y="146">잔존가치 · 임대료</text></g><path class="line" d="M828 90 L872 90"/><g transform="translate(872)"><rect class="box" width="252" height="180" rx="18"/><text class="tag" x="22" y="38">REVENUE</text><text class="h" x="22" y="82">토큰 · 서비스</text><text class="s" x="22" y="118">고객 수요가 현금흐름</text><text class="s" x="22" y="146">compute ≠ 자동 수익</text></g></g>
  <g transform="translate(90 392)"><rect class="risk" width="1020" height="144" rx="20"/><text class="h" x="32" y="42">누가 위험을 갖는가?</text><text class="s" x="32" y="78">수요 부족 · GPU 세대교체 · 전력 지연 · 담보가치 하락 · 고객 집중 · 공급사 보증</text><line x1="32" x2="988" y1="96" y2="96" stroke="#e2a834" stroke-width="2"/><text class="s" x="510" y="124" text-anchor="middle">NVIDIA의 “생산적 자산” 주장은 금융 계약의 손실 분담·가동률·잔존가치로 검증해야 한다</text></g>
  <text class="s" x="600" y="590" text-anchor="middle">GPU가 반도체 재고에서 장기 인프라 담보로 이동하면 AI 경쟁은 모델뿐 아니라 자본비용 경쟁이 된다</text>
</svg>
