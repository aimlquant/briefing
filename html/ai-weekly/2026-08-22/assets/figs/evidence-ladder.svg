<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">주간 뉴스가 실행 판단으로 바뀌는 네 단계</title>
  <desc id="desc">커뮤니티 반응에서 시작해 1차 출처, 주장 조건과 한계, 실행 판단으로 올라가는 네 단계의 증거 사다리</desc>
  <style>
    .bg{fill:#f7f8fb}.step{fill:#fff;stroke:#c5d0df;stroke-width:3}.step2{fill:#eef3fa;stroke:#7f9bc4;stroke-width:3}.step4{fill:#0f2c59}.num{font:900 18px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.h{font:900 27px Inter,'Noto Sans KR',sans-serif;fill:#101114}.p{font:600 17px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.white{fill:#fff}.rule{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#0f2c59}.line{stroke:#2563eb;stroke-width:6;stroke-linecap:round}
  </style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <line class="line" x1="150" y1="500" x2="1030" y2="500"/>
  <g transform="translate(56 348)"><rect class="step" width="250" height="190" rx="18"/><text class="num" x="24" y="42">01 · DISCOVER</text><text class="h" x="24" y="84">반응 신호</text><text class="p" x="24" y="124">HN · YouTube · SNS</text><text class="p" x="24" y="154">중요 후보를 찾는다</text></g>
  <g transform="translate(334 260)"><rect class="step2" width="250" height="278" rx="18"/><text class="num" x="24" y="42">02 · VERIFY</text><text class="h" x="24" y="84">1차 출처</text><text class="p" x="24" y="124">공식 발표 · 논문</text><text class="p" x="24" y="154">코드 · 보안 공개</text><text class="p" x="24" y="208">사실과 날짜를</text><text class="p" x="24" y="238">원문에서 고정한다</text></g>
  <g transform="translate(612 172)"><rect class="step2" width="250" height="366" rx="18"/><text class="num" x="24" y="42">03 · BOUND</text><text class="h" x="24" y="84">조건과 한계</text><text class="p" x="24" y="124">회사 자체 측정인가</text><text class="p" x="24" y="154">프리프린트인가</text><text class="p" x="24" y="184">상관인가 인과인가</text><text class="p" x="24" y="238">오탐·표본·시점의</text><text class="p" x="24" y="268">해석 경계를 남긴다</text></g>
  <g transform="translate(890 84)"><rect class="step4" width="250" height="454" rx="18"/><text class="num white" x="24" y="42">04 · DECIDE</text><text class="h white" x="24" y="84">실행 판단</text><text class="p white" x="24" y="124">무엇을 바꿀지</text><text class="p white" x="24" y="154">어떤 지표를 볼지</text><text class="p white" x="24" y="184">언제 멈출지</text><text class="p white" x="24" y="238">증거가 약하면</text><text class="p white" x="24" y="268">결론도 약하게 둔다</text></g>
  <text class="rule" x="600" y="590" text-anchor="middle">인기 순위는 입구이고, 실행 판단은 원문·조건·실패 경계를 통과한 뒤에만 만든다.</text>
</svg>
