<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">모델 속도를 업무 완료 시간으로 바꾸는 측정 루프</title><desc id="desc">요청 준비, 첫 토큰, 생성, 도구 실행, 검증까지 이어지는 동등한 너비의 다섯 단계와 측정 지표</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.accent{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.n{font:900 18px Inter,sans-serif;fill:#2563eb}.h{font:850 20px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.metric{fill:#0f2c59}.white{font:800 17px Inter,'Noto Sans KR',sans-serif;fill:#fff}.foot{font:750 17px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(35 130)"><g><rect class="box" width="190" height="176" rx="18"/><text class="n" x="20" y="38">01</text><text class="h" x="20" y="78">요청 준비</text><text class="s" x="20" y="112">프롬프트·컨텍스트</text><text class="s" x="20" y="139">업로드·캐시</text></g><path class="line" d="M190 88 L230 88"/><g transform="translate(230)"><rect class="box" width="190" height="176" rx="18"/><text class="n" x="20" y="38">02</text><text class="h" x="20" y="78">첫 토큰</text><text class="s" x="20" y="112">큐·prefill</text><text class="s" x="20" y="139">TTFT</text></g><path class="line" d="M420 88 L460 88"/><g transform="translate(460)"><rect class="accent" width="190" height="176" rx="18"/><text class="n" x="20" y="38">03</text><text class="h" x="20" y="78">생성</text><text class="s" x="20" y="112">output tok/s</text><text class="s" x="20" y="139">reasoning tokens</text></g><path class="line" d="M650 88 L690 88"/><g transform="translate(690)"><rect class="box" width="190" height="176" rx="18"/><text class="n" x="20" y="38">04</text><text class="h" x="20" y="78">도구 실행</text><text class="s" x="20" y="112">브라우저·코드·API</text><text class="s" x="20" y="139">재시도·대기</text></g><path class="line" d="M880 88 L920 88"/><g transform="translate(920)"><rect class="box" width="190" height="176" rx="18"/><text class="n" x="20" y="38">05</text><text class="h" x="20" y="78">검증</text><text class="s" x="20" y="112">테스트·사람 승인</text><text class="s" x="20" y="139">완료·롤백</text></g></g>
  <g transform="translate(76 358)"><rect class="metric" width="1048" height="118" rx="20"/><text class="white" x="104" y="47" text-anchor="middle">p50 / p95</text><text class="white" x="314" y="47" text-anchor="middle">완료 성공률</text><text class="white" x="524" y="47" text-anchor="middle">원/성공 작업</text><text class="white" x="734" y="47" text-anchor="middle">재시도 횟수</text><text class="white" x="944" y="47" text-anchor="middle">승인 대기</text><line x1="52" x2="996" y1="68" y2="68" stroke="#7692b4" stroke-width="2"/><text class="white" x="524" y="98" text-anchor="middle">모델 속도는 03의 지표 하나 · 사용자가 사는 것은 01→05의 end-to-end 시간</text></g>
  <text class="foot" x="600" y="558" text-anchor="middle">속도가 빨라질수록 병목은 생성에서 도구·검증·승인으로 이동한다</text>
</svg>
