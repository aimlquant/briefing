<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Linear 관찰 데이터가 보여 준 AI 채택과 산출의 동시 증가</title>
  <desc id="desc">제품 직군 AI 사용률 12에서 34퍼센트, 제품 직군 PR 첨부 3에서 10퍼센트, 디자인 직군 1에서 8퍼센트, 팀별 주간 PR 111퍼센트 증가를 나란히 표시하고 인과 해석의 한계를 강조한다</desc>
  <style>
    .bg{fill:#f7f8fb}.card{fill:#fff;stroke:#c5d0df;stroke-width:3}.h{font:900 20px Inter,'Noto Sans KR',sans-serif;fill:#101114}.v{font:900 43px Inter,'Noto Sans KR',sans-serif;fill:#0f2c59}.from{font:700 18px Inter,'Noto Sans KR',sans-serif;fill:#69717d}.bar0{fill:#d7deea}.bar1{fill:#2563eb}.note{fill:#fff4dc;stroke:#d29a3a;stroke-width:2}.nh{font:900 21px Inter,'Noto Sans KR',sans-serif;fill:#6f4607}.np{font:650 17px Inter,'Noto Sans KR',sans-serif;fill:#6f4607}
  </style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(54 54)"><rect class="card" width="258" height="330" rx="18"/><text class="h" x="24" y="46">제품 직군 AI 사용</text><text class="v" x="24" y="108">12 → 34%</text><text class="from" x="24" y="140">2026.01 → 06</text><rect class="bar0" x="24" y="190" width="76" height="34" rx="8"/><rect class="bar1" x="24" y="244" width="214" height="34" rx="8"/></g>
  <g transform="translate(332 54)"><rect class="card" width="258" height="330" rx="18"/><text class="h" x="24" y="46">제품 직군 PR 첨부</text><text class="v" x="24" y="108">3 → 10%</text><text class="from" x="24" y="140">2024.06 → 2026.06</text><rect class="bar0" x="24" y="190" width="54" height="34" rx="8"/><rect class="bar1" x="24" y="244" width="180" height="34" rx="8"/></g>
  <g transform="translate(610 54)"><rect class="card" width="258" height="330" rx="18"/><text class="h" x="24" y="46">디자인 직군 PR 첨부</text><text class="v" x="24" y="108">1 → 8%</text><text class="from" x="24" y="140">2024.06 → 2026.06</text><rect class="bar0" x="24" y="190" width="26" height="34" rx="8"/><rect class="bar1" x="24" y="244" width="208" height="34" rx="8"/></g>
  <g transform="translate(888 54)"><rect class="card" width="258" height="330" rx="18"/><text class="h" x="24" y="46">팀별 주간 PR</text><text class="v" x="24" y="108">+111%</text><text class="from" x="24" y="140">2024.06 기준 대비</text><rect class="bar0" x="24" y="190" width="96" height="34" rx="8"/><rect class="bar1" x="24" y="244" width="208" height="34" rx="8"/></g>
  <g transform="translate(54 424)"><rect class="note" width="1092" height="150" rx="18"/><text class="nh" x="28" y="46">해석 경계 · 더 많이 만들었다 ≠ 더 가치 있게 만들었다</text><text class="np" x="28" y="84">Linear에 연결된 유료 사용자의 관찰 데이터이며, 외부 AI 사용은 보이지 않는다. 열린 PR은 병합·품질·사업 가치가 아니다.</text><text class="np" x="28" y="116">Linear 안의 계획 시간은 대체로 그대로였고 AI 작업은 기존 업무 위에 추가됐다. 인과가 아니라 함께 움직인 패턴으로 읽는다.</text></g>
</svg>
