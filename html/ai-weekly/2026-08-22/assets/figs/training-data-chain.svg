<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>희귀 서적에서 학습 데이터로 이어지는 확인과 미확인 경계</title>
  <desc>대량 주문, AirTag 추적, VGT3 스캔 공정은 확인됐지만 데이터셋 편입과 모델 학습, 권리 근거는 공개되지 않은 공급망</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker><marker id="arrow2" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#e4562a"/></marker></defs>
  <style>.bg{fill:#f8fafc}.known{fill:#e9f2ff;stroke:#1f5ea8;stroke-width:2}.unknown{fill:#fff0ea;stroke:#e4562a;stroke-width:2;stroke-dasharray:9 7}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px;font-weight:850;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.line{stroke:#1f5ea8;stroke-width:4;fill:none}.dash{stroke:#e4562a;stroke-width:4;fill:none;stroke-dasharray:10 8}.tag{font-family:Arial,sans-serif;font-size:13px;font-weight:850;letter-spacing:1px}.fact{fill:#1f5ea8}.open{fill:#e4562a}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <g><rect class="known" x="25" y="190" width="170" height="185" rx="20"/><rect class="known" x="255" y="190" width="170" height="185" rx="20"/><rect class="known" x="485" y="190" width="190" height="185" rx="20"/><rect class="unknown" x="735" y="190" width="190" height="185" rx="20"/><rect class="unknown" x="985" y="190" width="190" height="185" rx="20"/></g>
  <g class="tag"><text class="fact" x="45" y="225">CONFIRMED</text><text class="fact" x="275" y="225">CONFIRMED</text><text class="fact" x="505" y="225">CORROBORATED</text><text class="open" x="755" y="225">NOT DISCLOSED</text><text class="open" x="1005" y="225">NOT DISCLOSED</text></g>
  <g class="t" text-anchor="middle"><text x="110" y="275"><tspan x="110">약 1,000권</tspan><tspan class="s" x="110" dy="30">Biblio 대량 주문</tspan></text><text x="340" y="275"><tspan x="340">AirTag</tspan><tspan class="s" x="340" dy="30">Amazon VGT3 도착</tspan></text><text x="580" y="265"><tspan x="580">제본 제거·스캔</tspan><tspan class="s" x="580" dy="30">현장 증언</tspan><tspan class="s" x="580" dy="22">시설 로고·공정</tspan></text><text x="830" y="275"><tspan x="830">코퍼스 편입</tspan><tspan class="s" x="830" dy="30">어떤 데이터셋?</tspan></text><text x="1080" y="265"><tspan x="1080">모델 학습</tspan><tspan class="s" x="1080" dy="30">어떤 모델?</tspan><tspan class="s" x="1080" dy="22">어떤 권리 근거?</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="195" y1="282" x2="255" y2="282"/><line data-connector="true" marker-end="url(#arrow)" x1="425" y1="282" x2="485" y2="282"/></g><g class="dash"><line data-connector="true" marker-end="url(#arrow2)" x1="675" y1="282" x2="735" y2="282"/><line data-connector="true" marker-end="url(#arrow2)" x1="925" y1="282" x2="985" y2="282"/></g>
  <rect x="70" y="465" width="515" height="82" rx="20" fill="#e9f2ff"/><rect x="615" y="465" width="515" height="82" rx="20" fill="#fff0ea"/><text class="t" x="327" y="500" text-anchor="middle">실선: 추적·관찰·증언이 뒷받침</text><text class="t" x="872" y="500" text-anchor="middle">점선: 기사만으로 단정할 수 없음</text><text class="s" x="327" y="530" text-anchor="middle">물리적 공급망의 존재</text><text class="s" x="872" y="530" text-anchor="middle">디지털 사용 범위와 법적 정당성</text>
</svg>
