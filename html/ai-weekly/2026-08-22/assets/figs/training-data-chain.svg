<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">희귀 서적에서 AI 학습 데이터까지의 물리 공급망</title><desc id="desc">판매자, 추적 주문, Amazon VGT3 시설, 제본 제거와 스캔, 불투명한 데이터 사용으로 이어지며 확인과 미공개 영역을 구분</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a93650"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.seen{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.unknown{fill:#f7dce2;stroke:#a93650;stroke-width:3;stroke-dasharray:10 7}.h{font:900 21px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.tag{font:850 14px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.red{fill:#a93650}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.infer{stroke:#a93650;stroke-width:5;stroke-dasharray:10 8;fill:none;marker-end:url(#b)}.foot{font:750 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}</style>
  <rect class="bg" width="1200" height="630" rx="24"/><text class="h" x="600" y="70" text-anchor="middle">웹 크롤링 밖에도 절단기·스캐너·창고가 있다</text>
  <g transform="translate(34 160)"><g><rect class="box" width="190" height="190" rx="18"/><text class="tag" x="20" y="38">OBSERVED</text><text class="h" x="20" y="80">희귀 서적 판매자</text><text class="s" x="20" y="118">약 1,000권 주문</text><text class="s" x="20" y="148">AirTag 삽입</text></g><path class="line" d="M190 95 L230 95"/><g transform="translate(230)"><rect class="seen" width="190" height="190" rx="18"/><text class="tag" x="20" y="38">TRACKED</text><text class="h" x="20" y="80">배송 경로</text><text class="s" x="20" y="118">국가 횡단</text><text class="s" x="20" y="148">LAS8 · VGT3 도착</text></g><path class="line" d="M420 95 L460 95"/><g transform="translate(460)"><rect class="seen" width="190" height="190" rx="18"/><text class="tag" x="20" y="38">TESTIMONY</text><text class="h" x="20" y="80">Amazon 시설</text><text class="s" x="20" y="118">직원·포럼 증언</text><text class="s" x="20" y="148">책 스캔 작업</text></g><path class="line" d="M650 95 L690 95"/><g transform="translate(690)"><rect class="seen" width="190" height="190" rx="18"/><text class="tag" x="20" y="38">PHYSICAL PROCESS</text><text class="h" x="20" y="80">제본 제거</text><text class="s" x="20" y="118">절단 · 고속 스캔</text><text class="s" x="20" y="148">물리본 폐기</text></g><path class="infer" d="M880 95 L920 95"/><g transform="translate(920)"><rect class="unknown" width="220" height="190" rx="18"/><text class="tag red" x="20" y="38">NOT DISCLOSED</text><text class="h" x="20" y="80">모델별 사용</text><text class="s" x="20" y="118">권리·보상·보존</text><text class="s" x="20" y="148">전체 규모·제외 절차</text></g></g>
  <g transform="translate(120 400)"><rect class="box" width="960" height="112" rx="18"/><text class="h" x="480" y="42" text-anchor="middle">증거의 강도도 단계별로 다르다</text><text class="s" x="480" y="76" text-anchor="middle">AirTag 도착 + 현장 증언은 강함 · 모든 책과 모든 모델의 학습 사용 범위는 미공개</text></g>
  <text class="foot" x="600" y="576" text-anchor="middle">탐사 보도의 핵심은 “AI가 책을 읽었다”가 아니라 데이터 공급망의 물리 비용과 권리 경계가 보이지 않았다는 점</text>
</svg>
