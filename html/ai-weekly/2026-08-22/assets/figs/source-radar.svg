    <g transform="translate(0 98)"><rect class="lane" width="190" height="82" rx="14"/><text class="h" x="18" y="34">MEDIA</text><text class="n" x="168" y="38" text-anchor="end">5</text><text class="s" x="18" y="62">한국 1 · 영어권 4</text></g>
    <g transform="translate(0 196)"><rect class="lane" width="190" height="82" rx="14"/><text class="h" x="18" y="34">EXPERT</text><text class="n" x="168" y="38" text-anchor="end">4</text><text class="s" x="18" y="62">실험 · 벤치 · 해설</text></g>
    <g transform="translate(0 294)"><rect class="lane" width="190" height="82" rx="14"/><text class="h" x="18" y="34">COMMUNITY</text><text class="n" x="168" y="38" text-anchor="end">2</text><text class="s" x="18" y="62">HN · LocalLLaMA</text></g>
    <g transform="translate(0 392)"><rect class="lane" width="190" height="82" rx="14"/><text class="h" x="18" y="34">PRIMARY</text><text class="n" x="168" y="38" text-anchor="end">9</text><text class="s" x="18" y="62">공식 · 논문 · 코드</text></g>
