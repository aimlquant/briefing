  <style>.bg{fill:#f7f8fb}.lane{fill:#fff;stroke:#c9d2df;stroke-width:2}.core{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.out{fill:#0f2c59}.h{font:900 22px Inter,'Noto Sans KR',sans-serif;fill:#101114}.n{font:900 32px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.white{fill:#fff}.line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}.foot{font:750 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}</style>
