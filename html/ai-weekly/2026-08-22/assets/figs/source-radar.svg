<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">이번 호 동적 소스 레이더</title><desc id="desc">유튜브, 미디어, 전문가, 커뮤니티, 공식 연구의 다섯 레인이 26개 선정 소스로 모이고 10개 이슈로 편집되는 구조</desc>
