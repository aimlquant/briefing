<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Grok Bot의 전용 컴퓨터형 에이전트 구조</title><desc id="desc">사람의 목표와 승인에서 Grok Bot, 전용 클라우드 컴퓨터, 로그인된 앱으로 이어지고 감사 로그가 되돌아오는 구조</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8c9bb0"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.bot{fill:#e8eef8;stroke:#2563eb;stroke-width:4}.app{fill:#0f2c59}.h{font:900 23px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.w{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#fff}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.audit{stroke:#8c9bb0;stroke-width:4;stroke-dasharray:10 8;fill:none;marker-end:url(#b)}.tag{font:850 15px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(36 210)"><rect class="box" width="190" height="166" rx="18"/><text class="tag" x="20" y="36">HUMAN</text><text class="h" x="20" y="78">목표·정책</text><text class="s" x="20" y="112">예산 · 시간 · 금지선</text><text class="s" x="20" y="140">승인 · 중단</text></g>
  <path class="line" d="M226 293 L300 293"/>
  <g transform="translate(300 168)"><rect class="bot" width="244" height="250" rx="22"/><text class="tag" x="24" y="42">GROK BOT</text><text class="h" x="24" y="86">계획·기억·실행</text><line x1="24" x2="220" y1="110" y2="110" stroke="#9fb0c8" stroke-width="2"/><text class="s" x="24" y="148">작업 분해</text><text class="s" x="24" y="180">상태 유지</text><text class="s" x="24" y="212">필요할 때 승인 요청</text></g>
  <path class="line" d="M544 293 L620 293"/>
  <g transform="translate(620 168)"><rect class="box" width="244" height="250" rx="22"/><text class="tag" x="24" y="42">DEDICATED COMPUTER</text><text class="h" x="24" y="86">격리된 작업공간</text><line x1="24" x2="220" y1="110" y2="110" stroke="#9fb0c8" stroke-width="2"/><text class="s" x="24" y="148">브라우저 · 파일</text><text class="s" x="24" y="180">앱 세션 · 도구</text><text class="s" x="24" y="212">24/7 지속 실행</text></g>
  <path class="line" d="M864 293 L930 293"/>
  <g transform="translate(930 102)"><rect class="app" width="234" height="88" rx="16"/><text class="w" x="117" y="53" text-anchor="middle">메일 · 캘린더</text><rect class="app" y="118" width="234" height="88" rx="16"/><text class="w" x="117" y="171" text-anchor="middle">CRM · 문서 · 쇼핑</text><rect class="app" y="236" width="234" height="88" rx="16"/><text class="w" x="117" y="289" text-anchor="middle">코드 · 터미널 · 웹</text></g>
  <path class="audit" d="M1047 442 L1047 510 L131 510 L131 376"/><text class="s" x="600" y="545" text-anchor="middle">감사 로그 · 결과물 · 승인 이력 · 실패 상태</text>
  <text class="h" x="600" y="82" text-anchor="middle">제품의 새 단위: 채팅 세션이 아니라 자격증명을 가진 지속 실행 환경</text>
</svg>
