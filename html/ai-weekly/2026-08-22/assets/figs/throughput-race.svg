<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Gemini 3.7 Flash와 GPT-5.6 Sol Ultrafast의 속도 주장</title><desc id="desc">서로 다른 측정 조건의 속도 수치를 별도 카드로 보여주고 직접 순위 비교를 금지하는 도표</desc>
  <style>.bg{fill:#f7f8fb}.card{fill:#fff;stroke:#c9d2df;stroke-width:3}.g{fill:#2563eb}.o{fill:#0f2c59}.h{font:900 24px Inter,'Noto Sans KR',sans-serif;fill:#101114}.big{font:950 62px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.unit{font:800 21px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.s{font:650 17px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.tag{font:850 15px Inter,'Noto Sans KR',sans-serif;fill:#fff}.warn{fill:#fff4dc;stroke:#e2a834;stroke-width:2}.w{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#6f4b00}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(44 54)"><rect class="card" width="526" height="390" rx="22"/><rect class="g" x="26" y="24" width="162" height="34" rx="17"/><text class="tag" x="107" y="47" text-anchor="middle">INDEPENDENT TEST</text><text class="h" x="28" y="102">Gemini 3.7 Flash · high</text><text class="big" x="28" y="188">389.5</text><text class="unit" x="273" y="187">median output tok/s</text><rect fill="#dce9ff" x="28" y="220" width="442" height="34" rx="17"/><rect class="g" x="28" y="220" width="350" height="34" rx="17"/><text class="s" x="28" y="296">출처 · Artificial Analysis</text><text class="s" x="28" y="329">공급자·추론 설정·지역에 따라 달라짐</text><text class="s" x="28" y="362">모델 카드 · $0.75 / $3.75 도입가</text></g>
  <g transform="translate(630 54)"><rect class="card" width="526" height="390" rx="22"/><rect class="o" x="26" y="24" width="142" height="34" rx="17"/><text class="tag" x="97" y="47" text-anchor="middle">VENDOR MAX</text><text class="h" x="28" y="102">GPT-5.6 Sol · Ultrafast</text><text class="big" x="28" y="188">750</text><text class="unit" x="210" y="187">up to output tok/s</text><rect fill="#dce9ff" x="28" y="220" width="442" height="34" rx="17"/><rect class="o" x="28" y="220" width="442" height="34" rx="17"/><text class="s" x="28" y="296">출처 · OpenAI / Cerebras</text><text class="s" x="28" y="329">제한 프리뷰 · 최대치 · Standard 대비 최대 14×</text><text class="s" x="28" y="362">가격·p50/p95·동시성 한도는 미공개</text></g>
  <g transform="translate(140 482)"><rect class="warn" width="920" height="104" rx="18"/><text class="w" x="460" y="40" text-anchor="middle">389.5와 750은 같은 트랙의 결승 기록이 아니다</text><text class="s" x="460" y="72" text-anchor="middle">실무 비교는 동일 프롬프트 · 동일 품질 기준 · p50/p95 · 비용 · 제한량을 함께 측정한다</text></g>
