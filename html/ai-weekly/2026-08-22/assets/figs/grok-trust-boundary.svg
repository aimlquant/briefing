<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>Grok Bot 전용 컴퓨터의 신뢰 경계</title>
  <desc>사용자 지시가 봇, 클라우드 컴퓨터, 로그인된 앱을 거쳐 외부 행동이 되는 구조와 통제 지점을 보여준다</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.zone{fill:#e9f2ff;stroke:#79a8df;stroke-width:2;stroke-dasharray:10 8}.node{fill:#fff;stroke:#1f5ea8;stroke-width:2}.risk{fill:#fff0ea;stroke:#e4562a;stroke-width:2}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:19px;font-weight:800;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.tag{font-family:Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;fill:#1f5ea8}.line{stroke:#1f5ea8;stroke-width:4;fill:none}</style>
  <rect class="bg" width="1200" height="680" rx="24"/><rect class="zone" x="230" y="70" width="770" height="480" rx="28"/><text class="tag" x="260" y="108">오래 유지되는 신뢰 경계</text>
  <rect class="node" x="20" y="205" width="170" height="170" rx="20"/><rect class="node" x="260" y="205" width="190" height="170" rx="20"/><rect class="node" x="540" y="205" width="220" height="170" rx="20"/><rect class="node" x="850" y="205" width="130" height="170" rx="20"/><rect class="risk" x="1060" y="205" width="120" height="170" rx="20"/>
  <g class="t" text-anchor="middle"><text x="105" y="275"><tspan x="105">사용자</tspan><tspan class="s" x="105" dy="30">목표·판단</tspan></text><text x="355" y="265"><tspan x="355">Grok Bot</tspan><tspan class="s" x="355" dy="30">계획·기억</tspan><tspan class="s" x="355" dy="22">장기 실행</tspan></text><text x="650" y="255"><tspan x="650">클라우드 컴퓨터</tspan><tspan class="s" x="650" dy="30">파일·브라우저</tspan><tspan class="s" x="650" dy="22">세션·쿠키</tspan></text><text x="915" y="265"><tspan x="915">앱</tspan><tspan class="s" x="915" dy="30">메일·CRM</tspan><tspan class="s" x="915" dy="22">쇼핑·코드</tspan></text><text x="1120" y="265"><tspan x="1120">외부 행동</tspan><tspan class="s" x="1120" dy="30">전송·구매</tspan><tspan class="s" x="1120" dy="22">삭제·권한</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="190" y1="290" x2="260" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="450" y1="290" x2="540" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="760" y1="290" x2="850" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="980" y1="290" x2="1060" y2="290"/></g>
  <g class="s" text-anchor="middle"><text x="355" y="455">작업별 예산 · 중단</text><text x="650" y="455">최소권한 · 만료 · 격리</text><text x="915" y="455">승인 · 로그 · 복구</text></g>
</svg>
