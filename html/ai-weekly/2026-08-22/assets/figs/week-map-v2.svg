<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">이번 주 열 개 AI 뉴스 지도</title><desc id="desc">제품, 오픈 배포, 과학과 정책, 채택과 인프라, 데이터의 다섯 행에 딥다이브 세 개와 레이더 일곱 개를 배치</desc>
  <style>.bg{fill:#f7f8fb}.axis{fill:#0f2c59}.card{fill:#fff;stroke:#c9d2df;stroke-width:2}.deep{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.l{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#fff}.k{font:850 14px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.t{font:850 20px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 14px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.foot{font:750 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(30 32)">
    <g><rect class="axis" width="142" height="92" rx="14"/><text class="l" x="71" y="54" text-anchor="middle">제품</text></g><g transform="translate(160)"><rect class="deep" width="474" height="92" rx="14"/><text class="k" x="20" y="28">DEEP 01 · INFERENCE</text><text class="t" x="20" y="58">속도가 모델의 새 등급</text><text class="s" x="20" y="79">Gemini 3.7 · GPT-5.6 Ultrafast</text></g><g transform="translate(650)"><rect class="deep" width="474" height="92" rx="14"/><text class="k" x="20" y="28">DEEP 02 · AGENT</text><text class="t" x="20" y="58">전용 컴퓨터를 받은 Grok Bot</text><text class="s" x="20" y="79">24/7 실행 · 앱 로그인 · 승인</text></g>
    <g transform="translate(0 106)"><rect class="axis" width="142" height="92" rx="14"/><text class="l" x="71" y="54" text-anchor="middle">오픈 배포</text></g><g transform="translate(160 106)"><rect class="deep" width="474" height="92" rx="14"/><text class="k" x="20" y="28">DEEP 03 · OPEN</text><text class="t" x="20" y="58">Qwen 27B, 배포층의 반격</text><text class="s" x="20" y="79">17GB quant · 262K · local agent</text></g><g transform="translate(650 106)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 04 · SERVING</text><text class="t" x="20" y="58">DeepSeek + DSpark</text><text class="s" x="20" y="79">모델·draft·하네스 공동 설계</text></g>
    <g transform="translate(0 212)"><rect class="axis" width="142" height="92" rx="14"/><text class="l" x="71" y="54" text-anchor="middle">과학·정책</text></g><g transform="translate(160 212)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 05 · MATH</text><text class="t" x="20" y="58">제타 영점 하한 2/3</text><text class="s" x="20" y="79">Lean 검증 · RH 100%는 아님</text></g><g transform="translate(650 212)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 06 · GOVERNANCE</text><text class="t" x="20" y="58">Claude 텍스트 워터마크</text><text class="s" x="20" y="79">관여 신호 ≠ 저자 판결</text></g>
    <g transform="translate(0 318)"><rect class="axis" width="142" height="92" rx="14"/><text class="l" x="71" y="54" text-anchor="middle">응용·채택</text></g><g transform="translate(160 318)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 07 · HEALTH</text><text class="t" x="20" y="58">AMIE 영상 상담</text><text class="s" x="20" y="79">300회 모의 상담 · 비동기 agent</text></g><g transform="translate(650 318)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 08 · ENTERPRISE</text><text class="t" x="20" y="58">답변에서 위임으로</text><text class="s" x="20" y="79">Codex 64% · frontier gap 8.3×</text></g>
    <g transform="translate(0 424)"><rect class="axis" width="142" height="92" rx="14"/><text class="l" x="71" y="54" text-anchor="middle">산업·데이터</text></g><g transform="translate(160 424)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 09 · INFRA</text><text class="t" x="20" y="58">GPU가 금융 자산으로</text><text class="s" x="20" y="79">$500B 동원 목표 · 장기 플랫폼</text></g><g transform="translate(650 424)"><rect class="card" width="474" height="92" rx="14"/><text class="k" x="20" y="28">RADAR 10 · DATA</text><text class="t" x="20" y="58">AirTag가 찾은 책 스캔 시설</text><text class="s" x="20" y="79">물리 공급망 · 권리 범위 미공개</text></g>
  </g><text class="foot" x="600" y="590" text-anchor="middle">파란 면 = 딥다이브 · 흰 면 = 레이더 · 제품 2 / 오픈 2 / 과학·정책 3 / 채택·산업·데이터 3</text>
</svg>
