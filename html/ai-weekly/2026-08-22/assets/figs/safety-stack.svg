<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">사이버 임계 모델의 세 겹 통제 구조</title>
  <desc id="desc">격리된 실행, 토큰 단위 모니터링, 30분 내 인간 에스컬레이션이 왼쪽에서 오른쪽으로 이어지고, 위에는 학습 중단 게이트가 표시된다</desc>
  <defs><marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563eb"/></marker></defs>
  <style>
    .bg{fill:#f7f8fb}.gate{fill:#0f2c59}.box{fill:#fff;stroke:#b8c8e2;stroke-width:3}.n{font:900 18px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.h{font:900 28px Inter,'Noto Sans KR',sans-serif;fill:#101114}.p{font:600 18px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.white{fill:#fff}.big{font:900 34px Inter,'Noto Sans KR',sans-serif}.small{font:600 18px Inter,'Noto Sans KR',sans-serif}.arrow{fill:none;stroke:#2563eb;stroke-width:8;marker-end:url(#arrow)}.metric{fill:#e8eef8;stroke:#2563eb;stroke-width:2}.m1{font:900 32px Inter,sans-serif;fill:#0f2c59}.m2{font:700 17px Inter,'Noto Sans KR',sans-serif;fill:#0f2c59}
  </style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <rect class="gate" x="70" y="46" width="1060" height="104" rx="18"/>
  <text class="white big" x="100" y="91">학습 게이트</text><text class="white small" x="100" y="123">2주 RL 중단 · 최대 프런티어 RL 실행은 계속 보류</text>
  <g transform="translate(70 210)"><rect class="box" width="290" height="226" rx="18"/><text class="n" x="28" y="45">01 · SECURITY</text><text class="h" x="28" y="88">격리</text><text class="p" x="28" y="128">워크로드·네트워크</text><text class="p" x="28" y="159">강제 분리와 연속 테스트</text></g>
  <path class="arrow" d="M360 323H450"/>
  <g transform="translate(450 210)"><rect class="box" width="290" height="226" rx="18"/><text class="n" x="28" y="45">02 · MONITORING</text><text class="h" x="28" y="88">토큰 감시</text><text class="p" x="28" y="128">활성화 분류기와</text><text class="p" x="28" y="159">자동 조사기의 다단계 판정</text></g>
  <path class="arrow" d="M740 323H830"/>
  <g transform="translate(830 210)"><rect class="box" width="300" height="226" rx="18"/><text class="n" x="28" y="45">03 · ESCALATION</text><text class="h" x="28" y="88">인간 개입</text><text class="p" x="28" y="128">경보 뒤 30분 내</text><text class="p" x="28" y="159">확인·에스컬레이션</text></g>
  <g transform="translate(310 492)"><rect class="metric" width="260" height="92" rx="46"/><text class="m1" x="130" y="43" text-anchor="middle">≈20%</text><text class="m2" x="130" y="70" text-anchor="middle">추론 컴퓨트 오버헤드</text></g>
  <text class="p" x="610" y="531">통제는 모델 밖 부가 기능이 아니라</text><text class="h" x="610" y="568">릴리스 속도와 용량의 일부</text>
</svg>
