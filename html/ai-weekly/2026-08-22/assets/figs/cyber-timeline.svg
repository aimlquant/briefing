<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 사이버 임계 판단과 학습 게이트의 시간선</title>
  <desc id="desc">8월 7일 Astra의 critical 가능성 판단에서 도구 추론 모니터링 확대, 약 2주 강화학습 중단, 8월 18일 공개, 최대 프런티어 강화학습 보류 지속으로 이어지는 시간선</desc>
  <style>
    .bg{fill:#f7f8fb}.line{stroke:#9fb0c8;stroke-width:8;stroke-linecap:round}.dot{fill:#2563eb;stroke:#fff;stroke-width:7}.hold{fill:#a93650;stroke:#fff;stroke-width:7}.card{fill:#fff;stroke:#c5d0df;stroke-width:3}.h{font:900 23px Inter,'Noto Sans KR',sans-serif;fill:#101114}.date{font:900 18px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.p{font:600 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.tag{font:900 18px Inter,'Noto Sans KR',sans-serif;fill:#a93650}.foot{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#0f2c59}
  </style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <line class="line" x1="125" y1="318" x2="1075" y2="318"/>
  <g transform="translate(50 64)"><rect class="card" width="250" height="188" rx="18"/><text class="date" x="24" y="42">08.07</text><text class="h" x="24" y="82">능력 경계 신호</text><text class="p" x="24" y="120">Astra가 critical cyber</text><text class="p" x="24" y="150">가능성에 닿았다고 판단</text></g><circle class="dot" cx="175" cy="318" r="20"/>
  <g transform="translate(330 378)"><rect class="card" width="250" height="188" rx="18"/><text class="date" x="24" y="42">약 2주</text><text class="h" x="24" y="82">RL 훈련 중단</text><text class="p" x="24" y="120">환경을 강화하고</text><text class="p" x="24" y="150">감시 범위를 확대</text></g><circle class="dot" cx="455" cy="318" r="20"/>
  <g transform="translate(610 64)"><rect class="card" width="250" height="188" rx="18"/><text class="date" x="24" y="42">08.18</text><text class="h" x="24" y="82">운영 결정 공개</text><text class="p" x="24" y="120">격리 · 다단계 감시</text><text class="p" x="24" y="150">30분 인간 개입을 명시</text></g><circle class="dot" cx="735" cy="318" r="20"/>
  <g transform="translate(890 378)"><rect class="card" width="250" height="188" rx="18"/><text class="tag" x="24" y="42">STILL ON HOLD</text><text class="h" x="24" y="82">최대 실행 보류</text><text class="p" x="24" y="120">더 작은 훈련·평가로</text><text class="p" x="24" y="150">안전 근거를 먼저 축적</text></g><circle class="hold" cx="1015" cy="318" r="20"/>
  <text class="foot" x="600" y="603" text-anchor="middle">핵심 변화: 위험을 발견한 뒤 차단하는 것에서, 능력을 키우는 학습 자체를 게이트하는 것으로 이동했다.</text>
</svg>
