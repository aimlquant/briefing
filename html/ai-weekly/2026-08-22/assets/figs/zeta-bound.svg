<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>제타 영점 하한과 리만 가설의 거리</title>
  <desc>이전 5분의 12 하한, 새 3분의 2와 0.6725 하한, 리만 가설의 100퍼센트를 한 축에서 구분한다</desc>
  <style>.bg{fill:#f8fafc}.axis{stroke:#8491a5;stroke-width:8;stroke-linecap:round}.tick{stroke:#536078;stroke-width:3}.old{fill:#8491a5}.new{fill:#1f5ea8}.rh{fill:#e4562a}.pct{font-family:Arial,sans-serif;font-size:38px;font-weight:900;fill:#172033}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:18px;font-weight:800;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:15px;font-weight:650;fill:#536078}.band{fill:#e9f2ff}.gap{fill:#fff0ea}</style>
  <rect class="bg" width="1200" height="680" rx="24"/><rect class="band" x="130" y="185" width="638" height="190" rx="24"/><rect class="gap" x="768" y="185" width="302" height="190" rx="24"/>
  <line class="axis" x1="130" y1="320" x2="1070" y2="320"/><line class="tick" x1="130" y1="295" x2="130" y2="345"/><line class="tick" x1="522" y1="280" x2="522" y2="360"/><line class="tick" x1="757" y1="270" x2="757" y2="370"/><line class="tick" x1="762" y1="270" x2="762" y2="370"/><line class="tick" x1="1070" y1="270" x2="1070" y2="370"/>
  <circle class="old" cx="522" cy="320" r="16"/><circle class="new" cx="757" cy="320" r="18"/><circle class="new" cx="762" cy="320" r="9"/><circle class="rh" cx="1070" cy="320" r="18"/>
  <text class="pct" x="522" y="245" text-anchor="middle">41.7%</text><text class="t" x="522" y="400" text-anchor="middle">이전 무조건 하한 5/12</text>
  <text class="pct" x="760" y="140" text-anchor="middle">≥ 66.7%</text><text class="t" x="760" y="425" text-anchor="middle">새 기본 하한 2/3</text><text class="s" x="760" y="455" text-anchor="middle">최적 창에서는 67.25%</text>
  <text class="pct" x="1070" y="245" text-anchor="middle">100%</text><text class="t" x="1070" y="400" text-anchor="middle">리만 가설</text>
  <text class="s" x="130" y="565">증명된 비율의 하한이 커졌다는 뜻</text><text class="s" x="1070" y="565" text-anchor="end">가설 자체의 증명과는 논리적으로 별개</text>
</svg>
