<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AMIE Video 비동기 다중 에이전트 구조</title><desc id="desc">환자 영상과 음성이 대화 에이전트, 관찰 에이전트, 임상 추론 에이전트로 분기되어 조정되고 응답과 검사 안내로 돌아오는 흐름</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.agent{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.coord{fill:#0f2c59}.h{font:900 22px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.w{font:850 18px Inter,'Noto Sans KR',sans-serif;fill:#fff}.line{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#a)}.tag{font:850 14px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.foot{font:750 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(40 210)"><rect class="box" width="210" height="170" rx="18"/><text class="tag" x="20" y="38">SIMULATED PATIENT</text><text class="h" x="20" y="78">영상 · 음성</text><text class="s" x="20" y="114">표정 · 호흡 · 보행</text><text class="s" x="20" y="142">문진 답변</text></g>
  <path class="line" d="M250 295 L330 295"/>
  <g transform="translate(330 74)"><rect class="agent" width="300" height="128" rx="18"/><text class="tag" x="22" y="36">CONVERSATION AGENT</text><text class="h" x="22" y="74">낮은 지연의 대화</text><text class="s" x="22" y="104">환자 rapport · 다음 질문</text><rect class="agent" y="170" width="300" height="128" rx="18"/><text class="tag" x="22" y="206">OBSERVATION AGENT</text><text class="h" x="22" y="244">시청각 단서</text><text class="s" x="22" y="274">검사 동작 · 비언어 신호</text><rect class="agent" y="340" width="300" height="128" rx="18"/><text class="tag" x="22" y="376">CLINICAL REASONING</text><text class="h" x="22" y="414">느리지만 깊은 추론</text><text class="s" x="22" y="444">감별진단 · 관리 계획</text></g>
  <path class="line" d="M630 138 L724 245"/><path class="line" d="M630 308 L724 295"/><path class="line" d="M630 478 L724 345"/>
  <g transform="translate(724 198)"><rect class="coord" width="210" height="194" rx="20"/><text class="w" x="105" y="58" text-anchor="middle">ASYNCHRONOUS</text><text class="w" x="105" y="91" text-anchor="middle">COORDINATOR</text><line x1="28" x2="182" y1="116" y2="116" stroke="#7692b4" stroke-width="2"/><text class="w" x="105" y="150" text-anchor="middle">state · timing</text></g>
  <path class="line" d="M934 295 L1010 295"/><g transform="translate(1010 210)"><rect class="box" width="150" height="170" rx="18"/><text class="tag" x="75" y="40" text-anchor="middle">OUTPUT</text><text class="h" x="75" y="78" text-anchor="middle">응답</text><text class="s" x="75" y="112" text-anchor="middle">검사 안내</text><text class="s" x="75" y="140" text-anchor="middle">진단 계획</text></g>
  <text class="foot" x="600" y="590" text-anchor="middle">100 scenarios · 300 live consultations · 30 PCPs · 환자 배우를 쓴 모의 RCT, 실제 임상 배포 아님</text>
