<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek DSpark speculative decoding 흐름</title><desc id="desc">대상 모델이 여러 토큰을 초안하고 한 번에 검증해 맞는 접두사를 출력하는 네 단계와 하드웨어 조건</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker></defs>
  <style>.bg{fill:#f7f8fb}.box{fill:#fff;stroke:#c9d2df;stroke-width:3}.hot{fill:#e8eef8;stroke:#2563eb;stroke-width:4}.n{font:900 17px Inter,sans-serif;fill:#2563eb}.h{font:900 21px Inter,'Noto Sans KR',sans-serif;fill:#101114}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.line{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#a)}.code{fill:#0f2c59}.w{font:750 17px ui-monospace,monospace;fill:#fff}.warn{fill:#fff4dc;stroke:#e2a834;stroke-width:2}</style>
  <rect class="bg" width="1200" height="630" rx="24"/><text class="h" x="600" y="64" text-anchor="middle">별도 작은 draft 모델 대신 target checkpoint의 DSpark 모듈을 붙인다</text>
  <g transform="translate(44 118)"><g><rect class="box" width="230" height="180" rx="18"/><text class="n" x="22" y="38">01</text><text class="h" x="22" y="78">문맥 읽기</text><text class="s" x="22" y="116">V4 Pro target</text><text class="s" x="22" y="146">reasoning effort</text></g><path class="line" d="M230 90 L270 90"/><g transform="translate(270)"><rect class="hot" width="230" height="180" rx="18"/><text class="n" x="22" y="38">02</text><text class="h" x="22" y="78">7-token 초안</text><text class="s" x="22" y="116">DSpark MTP head</text><text class="s" x="22" y="146">greedy draft</text></g><path class="line" d="M500 90 L540 90"/><g transform="translate(540)"><rect class="box" width="230" height="180" rx="18"/><text class="n" x="22" y="38">03</text><text class="h" x="22" y="78">병렬 검증</text><text class="s" x="22" y="116">target 확률과 비교</text><text class="s" x="22" y="146">longest correct prefix</text></g><path class="line" d="M770 90 L810 90"/><g transform="translate(810)"><rect class="box" width="230" height="180" rx="18"/><text class="n" x="22" y="38">04</text><text class="h" x="22" y="78">접두사 출력</text><text class="s" x="22" y="116">맞은 토큰만 채택</text><text class="s" x="22" y="146">다음 loop</text></g></g>
  <g transform="translate(100 344)"><rect class="code" width="1000" height="106" rx="18"/><text class="w" x="32" y="43">vllm serve deepseek-ai/DeepSeek-V4-Pro-0813 \</text><text class="w" x="32" y="75">  --speculative-config '{"method":"dspark","num_speculative_tokens":7}'</text></g>
  <g transform="translate(220 482)"><rect class="warn" width="760" height="82" rx="16"/><text class="h" x="380" y="34" text-anchor="middle">공식 예시 · 단일 4×GB300 노드</text><text class="s" x="380" y="61" text-anchor="middle">MIT 가중치 공개 ≠ 소비자 장비에서 가벼운 모델</text></g>
</svg>
