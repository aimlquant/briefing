<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>DSpark 제안과 검증 루프</title>
  <desc>입력 문맥에서 가벼운 후보 생성기가 여러 토큰을 먼저 만들고 본 모델이 한꺼번에 확인해 맞는 앞부분만 확정하는 흐름</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#1f5ea8;stroke-width:2}.accent{fill:#e9f2ff;stroke:#1f5ea8;stroke-width:2}.ok{fill:#e9f8f4;stroke:#1c8c72;stroke-width:2}.token{fill:#fff;stroke:#79a8df;stroke-width:1.5}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:19px;font-weight:850;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px;font-weight:650;fill:#536078}.line{stroke:#1f5ea8;stroke-width:4;fill:none}.reject{stroke:#e4562a;stroke-width:3;fill:none;stroke-dasharray:9 7}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <rect class="node" x="40" y="205" width="180" height="170" rx="20"/><rect class="accent" x="290" y="205" width="200" height="170" rx="20"/><rect class="node" x="560" y="205" width="200" height="170" rx="20"/><rect class="node" x="830" y="205" width="160" height="170" rx="20"/><rect class="ok" x="1060" y="205" width="100" height="170" rx="20"/>
  <g class="t" text-anchor="middle"><text x="130" y="270"><tspan x="130">입력 문맥</tspan><tspan class="s" x="130" dy="30">요청 + 앞부분</tspan></text><text x="390" y="255"><tspan x="390">DSpark</tspan><tspan class="s" x="390" dy="30">병렬 계산</tspan><tspan class="s" x="390" dy="22">+ 순차 보정</tspan></text><text x="660" y="255"><tspan x="660">후보 묶음</tspan><tspan class="s" x="660" dy="30">최대 7토큰</tspan><tspan class="s" x="660" dy="22">확률에 따라 길이 조절</tspan></text><text x="910" y="255"><tspan x="910">본 모델</tspan><tspan class="s" x="910" dy="30">한꺼번에 확인</tspan><tspan class="s" x="910" dy="22">결과 분포 유지</tspan></text><text x="1110" y="255"><tspan x="1110">확정</tspan><tspan class="s" x="1110" dy="30">맞는</tspan><tspan class="s" x="1110" dy="22">앞부분</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="220" y1="290" x2="290" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="490" y1="290" x2="560" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="760" y1="290" x2="830" y2="290"/><line data-connector="true" marker-end="url(#arrow)" x1="990" y1="290" x2="1060" y2="290"/></g>
  <g class="token" transform="translate(585 405)"><rect x="0" y="0" width="42" height="42" rx="10"/><rect x="48" y="0" width="42" height="42" rx="10"/><rect x="96" y="0" width="42" height="42" rx="10"/><rect x="144" y="0" width="42" height="42" rx="10"/></g><g class="s" text-anchor="middle"><text x="606" y="432">t₁</text><text x="654" y="432">t₂</text><text x="702" y="432">t₃</text><text x="750" y="432">t₄</text></g>
  <polyline class="reject" data-connector="true" marker-end="url(#arrow)" points="910,375 910,510 390,510 390,375"/><text class="s" x="650" y="548" text-anchor="middle">첫 불일치 뒤의 후보는 버리고 다음 블록을 다시 제안</text>
</svg>
