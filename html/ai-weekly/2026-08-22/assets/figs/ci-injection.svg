<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions 비신뢰 입력의 위험 경로와 안전 경로</title>
  <desc id="desc">이슈 제목을 셸 스크립트에 직접 삽입하면 명령 실행과 비밀 유출로 이어지고, 환경 변수와 구조화된 파서 경로는 입력을 데이터로 유지하는 비교도</desc>
  <defs><marker id="badArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#a93650"/></marker><marker id="goodArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#26734d"/></marker></defs>
  <style>
    .bg{fill:#f7f8fb}.bad{fill:#fcebef;stroke:#c45a70;stroke-width:3}.good{fill:#e7f4ec;stroke:#3b8f65;stroke-width:3}.neutral{fill:#fff;stroke:#b8c8e2;stroke-width:3}.tagBad{font:900 19px Inter,'Noto Sans KR',sans-serif;fill:#a93650}.tagGood{font:900 19px Inter,'Noto Sans KR',sans-serif;fill:#26734d}.h{font:900 22px Inter,'Noto Sans KR',sans-serif;fill:#101114}.p{font:600 16px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.badArrow{fill:none;stroke:#a93650;stroke-width:7;marker-end:url(#badArrow)}.goodArrow{fill:none;stroke:#26734d;stroke-width:7;marker-end:url(#goodArrow)}.rule{font:800 18px Inter,'Noto Sans KR',sans-serif;fill:#0f2c59}
  </style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <text class="tagBad" x="54" y="52">위험 경로 · 이벤트 데이터를 코드로 취급</text>
  <g transform="translate(54 76)"><rect class="neutral" width="230" height="164" rx="16"/><text class="h" x="24" y="55">Issue title</text><text class="p" x="24" y="92">인증되지 않은 입력</text><text class="p" x="24" y="120">따옴표·셸 구문 포함</text></g>
  <path class="badArrow" d="M284 158H350"/>
  <g transform="translate(350 76)"><rect class="bad" width="230" height="164" rx="16"/><text class="h" x="24" y="55">${{ …title }}</text><text class="p" x="24" y="92">run: 블록에 직접</text><text class="p" x="24" y="120">문자열 보간</text></g>
  <path class="badArrow" d="M580 158H646"/>
  <g transform="translate(646 76)"><rect class="bad" width="230" height="164" rx="16"/><text class="h" x="24" y="55">Shell 실행</text><text class="p" x="24" y="92">echo 구문을 탈출해</text><text class="p" x="24" y="120">임의 명령으로 전환</text></g>
  <path class="badArrow" d="M876 158H942"/>
  <g transform="translate(942 76)"><rect class="bad" width="204" height="164" rx="16"/><text class="h" x="22" y="55">Jira 비밀</text><text class="p" x="22" y="92">워크플로 권한으로</text><text class="p" x="22" y="120">외부 유출</text></g>
  <text class="tagGood" x="54" y="318">안전 경로 · 이벤트 데이터를 끝까지 데이터로 유지</text>
  <g transform="translate(54 342)"><rect class="neutral" width="230" height="164" rx="16"/><text class="h" x="24" y="55">Issue title</text><text class="p" x="24" y="92">같은 비신뢰 입력</text><text class="p" x="24" y="120">경계를 먼저 표시</text></g>
  <path class="goodArrow" d="M284 424H410"/>
  <g transform="translate(410 342)"><rect class="good" width="310" height="164" rx="16"/><text class="h" x="24" y="55">env: ISSUE_TITLE</text><text class="p" x="24" y="92">환경 변수로 전달하고</text><text class="p" x="24" y="120">셸 코드와 분리</text></g>
  <path class="goodArrow" d="M720 424H846"/>
  <g transform="translate(846 342)"><rect class="good" width="300" height="164" rx="16"/><text class="h" x="24" y="55">jq --arg / API</text><text class="p" x="24" y="92">구조화된 인자로 처리</text><text class="p" x="24" y="120">+ 최소 권한·단기 토큰</text></g>
  <text class="rule" x="600" y="579" text-anchor="middle">리뷰 질문: “AI가 썼나?”보다 “비신뢰 입력이 어떤 권한으로 어디까지 가나?”</text>
</svg>
