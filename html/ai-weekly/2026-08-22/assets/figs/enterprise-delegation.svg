<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img">
  <title>기업 AI가 도움에서 위임으로 깊어지는 단계</title>
  <desc>질문과 초안에서 도구 사용, 지속 실행, 검증 가능한 위임으로 이동할 때 필요한 통제를 보여준다</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L14 7L0 14Z" fill="#1f5ea8"/></marker></defs>
  <style>.bg{fill:#f8fafc}.node{fill:#fff;stroke:#c9d3e1;stroke-width:2}.deep{fill:#e9f2ff;stroke:#1f5ea8;stroke-width:2}.t{font-family:Arial,'Noto Sans KR',sans-serif;font-size:20px;font-weight:850;fill:#172033}.s{font-family:Arial,'Noto Sans KR',sans-serif;font-size:15px;font-weight:650;fill:#536078}.line{stroke:#1f5ea8;stroke-width:4;fill:none}.metric{font-family:Arial,sans-serif;font-size:38px;font-weight:900;fill:#1f5ea8}.band{fill:#fff0ea;stroke:#e4562a;stroke-width:2}</style>
  <rect class="bg" width="1200" height="680" rx="24"/>
  <rect class="node" x="40" y="150" width="220" height="210" rx="20"/><rect class="node" x="340" y="150" width="220" height="210" rx="20"/><rect class="deep" x="640" y="150" width="220" height="210" rx="20"/><rect class="deep" x="940" y="150" width="220" height="210" rx="20"/>
  <g class="t" text-anchor="middle"><text x="150" y="210"><tspan x="150">도움</tspan><tspan class="s" x="150" dy="34">질문 · 요약 · 초안</tspan></text><text x="450" y="210"><tspan x="450">도구 사용</tspan><tspan class="s" x="450" dy="34">검색 · 파일 · 앱</tspan></text><text x="750" y="210"><tspan x="750">지속 실행</tspan><tspan class="s" x="750" dy="34">목표 · 반복 · 기억</tspan></text><text x="1050" y="210"><tspan x="1050">업무 위임</tspan><tspan class="s" x="1050" dy="34">완료 기준 · 승인 · 검증</tspan></text></g>
  <g class="line"><line data-connector="true" marker-end="url(#arrow)" x1="260" y1="255" x2="340" y2="255"/><line data-connector="true" marker-end="url(#arrow)" x1="560" y1="255" x2="640" y2="255"/><line data-connector="true" marker-end="url(#arrow)" x1="860" y1="255" x2="940" y2="255"/></g>
  <text class="metric" x="150" y="320" text-anchor="middle">1×</text><text class="metric" x="450" y="320" text-anchor="middle">2.6×</text><text class="metric" x="750" y="320" text-anchor="middle">8.3×</text><text class="metric" x="1050" y="320" text-anchor="middle">64%</text>
  <rect class="band" x="180" y="440" width="840" height="100" rx="20"/><text class="t" x="600" y="482" text-anchor="middle">토큰은 업무 위임의 깊이를 짐작하는 간접 지표일 뿐, 사업 가치는 아니다</text><text class="s" x="600" y="518" text-anchor="middle">완료율 · 사람 수정시간 · 오류 비용 · 승인 결과 · 고객 영향과 함께 본다</text>
</svg>
