<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">기업 AI가 답변에서 위임으로 이동한 신호</title><desc id="desc">Codex 토큰 비중 64퍼센트, 상위 기업 격차 8.3배, 직무별 주간 사용자 성장률을 보여주는 카드와 막대</desc>
  <style>.bg{fill:#f7f8fb}.card{fill:#fff;stroke:#c9d2df;stroke-width:3}.accent{fill:#e8eef8;stroke:#2563eb;stroke-width:3}.h{font:900 23px Inter,'Noto Sans KR',sans-serif;fill:#101114}.big{font:950 56px Inter,'Noto Sans KR',sans-serif;fill:#2563eb}.s{font:650 15px Inter,'Noto Sans KR',sans-serif;fill:#5f6570}.bar{fill:#2563eb}.base{fill:#d8dee8}.label{font:800 16px Inter,'Noto Sans KR',sans-serif;fill:#101114}.num{font:900 16px Inter,sans-serif;fill:#2563eb}.warn{fill:#fff4dc;stroke:#e2a834;stroke-width:2}</style>
  <rect class="bg" width="1200" height="630" rx="24"/>
  <g transform="translate(42 58)"><rect class="accent" width="350" height="222" rx="20"/><text class="big" x="28" y="86">64%</text><text class="h" x="28" y="128">Codex output share</text><text class="s" x="28" y="165">Codex + ChatGPT 결합 출력 토큰</text><text class="s" x="28" y="192">2026년 6월 · 기업 고객</text></g>
  <g transform="translate(424 58)"><rect class="card" width="350" height="222" rx="20"/><text class="big" x="28" y="86">8.3×</text><text class="h" x="28" y="128">frontier / typical</text><text class="s" x="28" y="165">활성 사용자당 출력 토큰</text><text class="s" x="28" y="192">1월 2.6× → 6월 8.3×</text></g>
  <g transform="translate(806 58)"><rect class="card" width="350" height="222" rx="20"/><text class="big" x="28" y="86">95%</text><text class="h" x="28" y="128">OpenAI plugin WAU</text><text class="s" x="28" y="165">frontier firms 21% · typical 9%</text><text class="s" x="28" y="192">공급사 내부와 고객 표본은 구분</text></g>
  <g transform="translate(72 320)"><text class="h" x="0" y="26">2월 이후 기업 Codex 주간 사용자 성장</text><g transform="translate(0 55)"><text class="label" x="0" y="20">법무</text><rect class="base" x="96" y="2" width="840" height="24" rx="12"/><rect class="bar" x="96" y="2" width="840" height="24" rx="12"/><text class="num" x="958" y="21">108×</text><text class="label" x="0" y="62">영업</text><rect class="base" x="96" y="44" width="840" height="24" rx="12"/><rect class="bar" x="96" y="44" width="319" height="24" rx="12"/><text class="num" x="437" y="63">41×</text><text class="label" x="0" y="104">채용</text><rect class="base" x="96" y="86" width="840" height="24" rx="12"/><rect class="bar" x="96" y="86" width="319" height="24" rx="12"/><text class="num" x="437" y="105">41×</text><text class="label" x="0" y="146">마케팅</text><rect class="base" x="96" y="128" width="840" height="24" rx="12"/><rect class="bar" x="96" y="128" width="202" height="24" rx="12"/><text class="num" x="320" y="147">26×</text><text class="label" x="0" y="188">엔지니어링</text><rect class="base" x="96" y="170" width="840" height="24" rx="12"/><rect class="bar" x="96" y="170" width="39" height="24" rx="12"/><text class="num" x="157" y="189">5×</text></g></g>
  <g transform="translate(288 548)"><rect class="warn" width="624" height="54" rx="14"/><text class="s" x="312" y="34" text-anchor="middle">토큰량은 위임 깊이의 불완전한 대리변수 · 가치·품질·ROI가 아니다</text></g>
